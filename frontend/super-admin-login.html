<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduAccess | Super Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f8fafc;
        --surface: #ffffff;
        --text: #1e293b;
        --muted: #64748b;
        --green: #10b981;
        --border: #f1f5f9;
        --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Inter', sans-serif;
        color: var(--text);
        background: var(--bg);
        display: grid;
        place-items: center;
        padding: 24px;
        position: relative;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        background: 
          radial-gradient(circle at 10% 10%, rgba(16, 185, 129, 0.05), transparent 30%),
          radial-gradient(circle at 90% 90%, rgba(59, 130, 246, 0.05), transparent 30%);
        z-index: -1;
      }

      .card {
        width: min(480px, 100%);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 48px;
        position: relative;
        z-index: 1;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 32px;
      }

      .brand-mark {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: linear-gradient(135deg, #10b981, #059669);
        color: #fff;
        font-weight: 800;
        display: grid;
        place-items: center;
        font-family: 'Outfit', sans-serif;
        font-size: 1.2rem;
        box-shadow: 0 8px 20px rgba(16, 185, 129, 0.2);
      }

      h1 {
        font-family: 'Outfit', sans-serif;
        font-size: 1.8rem;
        margin: 0;
        letter-spacing: -0.03em;
        font-weight: 800;
        color: var(--text);
      }

      .sub {
        margin: 0 0 32px;
        color: var(--muted);
        line-height: 1.6;
        font-weight: 500;
      }

      .field {
        display: grid;
        gap: 8px;
        margin-bottom: 20px;
      }

      .field label {
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .field input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: #f8fafc;
        padding: 16px;
        font-size: 1rem;
        font-weight: 600;
        outline: none;
        transition: all 0.2s ease;
      }

      .field input:focus {
        border-color: var(--green);
        background: white;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
      }

      .cta {
        width: 100%;
        border: 0;
        border-radius: 14px;
        background: #10b981;
        color: #fff;
        font-weight: 800;
        font-size: 0.95rem;
        padding: 18px;
        cursor: pointer;
        transition: all 0.2s ease;
        margin-top: 12px;
        box-shadow: 0 8px 20px rgba(16, 185, 129, 0.2);
        font-family: inherit;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .cta:hover {
        transform: translateY(-2px);
        background: #059669;
        box-shadow: 0 12px 24px rgba(16, 185, 129, 0.3);
      }

      .error {
        min-height: 24px;
        margin: 16px 0 0;
        color: #dc2626;
        font-size: 0.85rem;
        font-weight: 700;
        text-align: center;
      }

      .hint {
        margin: 32px 0 0;
        padding-top: 24px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 600;
        text-align: center;
      }

      .quick {
        margin-top: 16px;
        text-align: center;
      }

      .quick a {
        color: var(--green);
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 700;
      }

      .quick a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="card" aria-labelledby="loginTitle">
      <div class="brand">
        <div class="brand-mark">EA</div>
        <h1 id="loginTitle">Super Admin Login</h1>
      </div>
      <p class="sub">Sign in with super admin credentials to open the dashboard.</p>

      <form id="superAdminLoginForm" novalidate>
        <div class="field">
          <label for="superAdminEmail">Email Address</label>
          <input id="superAdminEmail" type="email" autocomplete="email" placeholder="Eduaccess@gmail.com" />
        </div>

        <div class="field">
          <label for="superAdminPassword">Password</label>
          <input id="superAdminPassword" type="password" autocomplete="current-password" placeholder="Enter password" />
        </div>

        <button class="cta" type="submit">Enter Super Admin Panel</button>
        <p class="error" id="authError" role="alert" aria-live="polite"></p>
      </form>

      <p class="hint">Hardcoded login is enabled only for this development environment.</p>
      <div class="quick">
        <a href="/">Back to home</a>
      </div>
    </main>

    <script>
      (function () {
        var SUPER_ADMIN_EMAIL = 'eduaccess@gmail.com';
        var SUPER_ADMIN_PASSWORD = 'Eduaccess2228';

        var form = document.getElementById('superAdminLoginForm');
        var emailInput = document.getElementById('superAdminEmail');
        var passwordInput = document.getElementById('superAdminPassword');
        var errorEl = document.getElementById('authError');
        var params = new URLSearchParams(window.location.search);

        function normalize(value) {
          return String(value || '').trim();
        }

        function normalizeEmail(value) {
          return normalize(value).toLowerCase();
        }

        function getNextPath() {
          var nextRaw = params.get('next');
          if (!nextRaw) return '/super-admin-panel.html';
          try {
            var decoded = decodeURIComponent(nextRaw);
            if (!decoded.startsWith('/')) return '/super-admin-panel.html';
            return decoded;
          } catch (_) {
            return '/super-admin-panel.html';
          }
        }

        function goToDashboard() {
          localStorage.setItem('superAdminAuthenticated', 'true');
          window.location.assign(getNextPath());
        }

        if (localStorage.getItem('superAdminAuthenticated') === 'true') {
          goToDashboard();
          return;
        }

        function handleLogin(event) {
          event.preventDefault();
          var email = normalizeEmail(emailInput && emailInput.value);
          var password = normalize(passwordInput && passwordInput.value);

          if (email === SUPER_ADMIN_EMAIL && password === SUPER_ADMIN_PASSWORD) {
            if (errorEl) errorEl.textContent = '';
            goToDashboard();
            return;
          }

          if (errorEl) errorEl.textContent = 'Invalid super admin credentials.';
        }

        if (!form) return;
        form.addEventListener('submit', handleLogin);
        [emailInput, passwordInput].forEach(function (input) {
          if (!input) return;
          input.addEventListener('keydown', function (event) {
            if (event.key !== 'Enter') return;
            handleLogin(event);
          });
        });
      })();
    </script>
  </body>
</html>
